name: Build DanceCamera IPA

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dance-camera-main-releases
  queue: max

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 25
    env:
      APP: DanceCamera
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested=$(xcodebuild -project "$APP.xcodeproj" -target "$APP" -configuration Release -showBuildSettings |
            awk '$1 == "MARKETING_VERSION" && $2 == "=" { version=$3 } END { print version }')
          version=$(python3 .github/scripts/publish_release.py --select-version "$requested")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build iPhone Release target
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project "$APP.xcodeproj" -target "$APP" \
            -configuration Release -sdk iphoneos ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/products" \
            OBJROOT="$RUNNER_TEMP/intermediates" build

      - name: Verify clip timing and video passthrough
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -target "$(uname -m)-apple-macos15.0" DanceCamera/TakeExport.swift DanceCamera/AudioTiming.swift DanceCamera/SourceSoundtrack.swift DanceCamera/SoundtrackAlignment.swift DanceCamera/PerformedAudioFeed.swift DanceCamera/IncrementalDecoder.swift Checks/TakeExportCheck.swift Checks/SourceAudioCheck.swift Checks/PerformedAudioCheck.swift -o "$RUNNER_TEMP/check-takes"
          "$RUNNER_TEMP/check-takes"

      - name: Package and verify IPA
        id: package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/products/$APP.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Info.plist")"
          number='(0|[1-9][0-9]*)'
          [[ "$version" =~ ^$number\.$number\.$number$ && "$version" == "$VERSION" && "$build" == "$GITHUB_RUN_NUMBER" ]]
          filename="$APP-v$version.ipa"
          ipa="$RUNNER_TEMP/$filename"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")"
          test -x "$bundle/$executable"
          xcrun lipo "$bundle/$executable" -verify_arch arm64
          xcrun vtool -show-build "$bundle/$executable" | grep -Eq 'platform[[:space:]]+IOS[[:space:]]*$'

          mkdir -p "$RUNNER_TEMP/package/Payload"
          /usr/bin/ditto "$bundle" "$RUNNER_TEMP/package/Payload/$APP.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -q -r -y "$ipa" Payload
          unzip -tq "$ipa"
          unzip -Z1 "$ipa" | grep -Fx "Payload/$APP.app/$executable"
          unzip -Z1 "$ipa" | grep -Fx "Payload/$APP.app/Info.plist"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/${{ steps.package.outputs.filename }}
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          FILENAME: ${{ steps.package.outputs.filename }}
        run: python3 .github/scripts/publish_release.py
