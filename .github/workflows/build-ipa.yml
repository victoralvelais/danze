name: Build DanceCamera IPA

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 25
    env:
      APP: DanceCamera
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build iPhone Release target
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project "$APP.xcodeproj" -target "$APP" \
            -configuration Release -sdk iphoneos ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/products" \
            OBJROOT="$RUNNER_TEMP/intermediates" build

      - name: Verify clip timing and video passthrough
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -target "$(uname -m)-apple-macos15.0" DanceCamera/TakeExport.swift DanceCamera/AudioTiming.swift DanceCamera/IncrementalDecoder.swift Checks/TakeExportCheck.swift -o "$RUNNER_TEMP/check-takes"
          "$RUNNER_TEMP/check-takes"

      - name: Package and verify IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/products/$APP.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Info.plist")"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ && "$build" == "$GITHUB_RUN_NUMBER" ]]
          tag="v$version-build.$build"
          filename="$APP-$tag.ipa"
          ipa="$RUNNER_TEMP/$filename"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")"
          test -x "$bundle/$executable"
          xcrun lipo "$bundle/$executable" -verify_arch arm64
          xcrun vtool -show-build "$bundle/$executable" | grep -Eq 'platform[[:space:]]+IOS[[:space:]]*$'

          mkdir -p "$RUNNER_TEMP/package/Payload"
          /usr/bin/ditto "$bundle" "$RUNNER_TEMP/package/Payload/$APP.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -q -r -y "$ipa" Payload
          unzip -tq "$ipa"
          unzip -Z1 "$ipa" | grep -Fx "Payload/$APP.app/$executable"
          unzip -Z1 "$ipa" | grep -Fx "Payload/$APP.app/Info.plist"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/${{ steps.package.outputs.filename }}
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          FILENAME: ${{ steps.package.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/$FILENAME"
          # A retry can finish an interrupted draft. Published builds keep their original binary.
          if release="$(gh release view "$TAG" --json isDraft,targetCommitish,assets)"; then
            if [[ "$(jq -r '.isDraft' <<< "$release")" == "true" ]]; then
              [[ "$(jq -r '.targetCommitish' <<< "$release")" == "$GITHUB_SHA" ]]
              gh release upload "$TAG" "$ipa" --clobber
              gh release edit "$TAG" --draft=false
            else
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" == "$GITHUB_SHA" ]]
              jq -e --arg asset "$FILENAME" 'any(.assets[]; .name == $asset and .size > 0 and .state == "uploaded")' <<< "$release"
            fi
          else
            gh release create "$TAG" "$ipa" --target "$GITHUB_SHA" \
              --title "$APP $VERSION (build $GITHUB_RUN_NUMBER)" --notes "LiveContainer IPA from commit $GITHUB_SHA."
          fi
